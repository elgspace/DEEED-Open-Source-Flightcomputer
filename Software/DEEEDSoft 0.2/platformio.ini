; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed-xiao-afruitnrf52-nrf52840-sense]
platform = SeeedStudio
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200

; Der Library Dependency Finder muss Include-Ketten ueber die Grenzen der
; eigenen lib/-Bibliotheken hinweg verfolgen: StateMachine.h bindet
; ImuSensor.h ein, das wiederum LSM6DS3.h braucht. Im Standardmodus "chain"
; bricht PlatformIO diese Kette an der Bibliotheksgrenze ab und meldet
; "LSM6DS3.h: No such file or directory". "deep+" folgt allen Includes
; rekursiv und loest das.
lib_ldf_mode = deep+

; Bibliotheken für IMU (LSM6DS3TR-C), BMP280, Watchdog und SD-Karte
lib_deps =
    seeed-studio/Seeed Arduino LSM6DS3@^2.0.3
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SleepyDog Library@^1.6.4
    greiman/SdFat@^2.2.2